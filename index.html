<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0c10" />
  <meta name="description" content="Three.js 기반 3D 더미 자동 전투 시뮬레이션" />
  <title>Dummy Fight 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0c10'/%3E%3Cpath d='M8 24L20 8' stroke='%23ff4d5a' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M24 24L12 8' stroke='%234d8dff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M8 24L20 8" stroke="#ff4d5a" stroke-width="3" stroke-linecap="round"/><path d="M24 24L12 8" stroke="#4d8dff" stroke-width="3" stroke-linecap="round"/></svg>
        </div>
        <div>
          <p class="eyebrow">AUTONOMOUS COMBAT SIMULATION</p>
          <h1>Dummy Fight <span>3D</span></h1>
        </div>
      </div>
      <div class="controls">
        <div class="btn-group">
          <button id="startBtn" class="primary"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>시작</button>
          <button id="pauseBtn"><svg viewBox="0 0 16 16"><path d="M4.5 3h2.5v10H4.5zM9 3h2.5v10H9z" fill="currentColor"/></svg>일시정지</button>
          <button id="resetBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.8-4.1M2.5 2.5v3h3"/></svg>리셋</button>
        </div>
        <label class="speed-control">
          <span>속도</span>
          <input id="speedRange" type="range" min="0.45" max="1.8" value="1" step="0.05" />
          <strong id="speedLabel">1.00×</strong>
        </label>
      </div>
    </header>

    <section class="arena-card">
      <div class="arena-head">
        <div class="head-left">
          <span class="live-pill"><i></i>LIVE 3D</span>
          <span class="clash-stat">CLASHES <b id="clashCount">0</b></span>
        </div>
        <div class="legend"><span>드래그 · 카메라</span><span>휠 · 줌</span><span>무기 충돌 시 공격 취소</span></div>
      </div>

      <div class="stage">
        <div class="hud">
          <article class="fighter-card red-card">
            <div class="fighter-title"><div><span class="dot red"></span><strong>RED DUMMY</strong></div><span class="weapon-badge">SHORT BLADE</span></div>
            <div class="meter-row"><span>출혈량</span><strong id="redBleedText">0 / 100</strong></div>
            <div class="meter"><div id="redBleedBar" class="meter-fill red-fill"></div></div>
            <div id="redStatus" class="limb-grid"></div>
          </article>

          <div class="round-panel">
            <span class="round-label">FIRST TO</span>
            <strong id="bleedLimitText">100</strong>
            <span class="round-label">BLEED LOSES</span>
            <span id="timeLabel" class="time-label">00.0s</span>
            <div id="matchState" class="match-state">READY</div>
          </div>

          <article class="fighter-card blue-card">
            <div class="fighter-title"><div><span class="dot blue"></span><strong>BLUE DUMMY</strong></div><span class="weapon-badge">SPEAR</span></div>
            <div class="meter-row"><span>출혈량</span><strong id="blueBleedText">0 / 100</strong></div>
            <div class="meter"><div id="blueBleedBar" class="meter-fill blue-fill"></div></div>
            <div id="blueStatus" class="limb-grid"></div>
          </article>
        </div>

        <div class="canvas-wrap">
          <div id="viewport3d" class="viewport3d" aria-label="3D 더미 전투 시뮬레이션"></div>
          <div class="vignette"></div>
          <div id="winnerOverlay" class="winner-overlay hidden">
            <p>MATCH COMPLETE</p>
            <h2 id="winnerText">RED WINS</h2>
            <button id="againBtn" class="primary">다시 시뮬레이션</button>
          </div>
        </div>
      </div>
    </section>

    <section class="bottom-grid">
      <article class="panel">
        <div class="section-title"><h2>전투 로그</h2><button id="clearLogBtn" class="text-button">비우기</button></div>
        <div id="combatLog" class="combat-log" role="log" aria-live="off"></div>
      </article>
      <article class="panel">
        <div class="section-title"><h2>시뮬레이션 설정</h2></div>
        <label><span>패배 출혈량</span><div class="input-row"><input id="bleedLimit" type="range" min="60" max="160" value="100" step="5" /><output id="bleedLimitValue">100</output></div></label>
        <label><span>파츠 분리 확률</span><div class="input-row"><input id="detachChance" type="range" min="0" max="100" value="38" step="1" /><output id="detachChanceValue">38%</output></div></label>
        <label><span>AI 공격성</span><div class="input-row"><input id="aggression" type="range" min="35" max="100" value="72" step="1" /><output id="aggressionValue">72%</output></div></label>
        <p class="safety-note">비고어 더미 시뮬레이션입니다. 파츠는 기계식 마네킹 부품처럼 분리되며 출혈은 수치로만 처리합니다.</p>
      </article>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
